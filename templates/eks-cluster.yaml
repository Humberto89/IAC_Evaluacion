AWSTemplateFormatVersion: '2010-09-09'
Description: EKS Cluster Template

Parameters:
  Environment:
    Type: String
    Default: qa

Resources:

  # ????? Rol para el control plane del EKS
  EKSServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy

  # ?? Rol para los nodos EC2 de EKS
  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess

  # ?? Cluster EKS
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub EKS-Cluster-${Environment}
      RoleArn: !GetAtt EKSServiceRole.Arn
      Version: "1.27"  # ? Versión estable
      ResourcesVpcConfig:
        SubnetIds:
          - !ImportValue 
              Fn::Sub: DevOps-Subnet1-${Environment}-Id
          - !ImportValue 
              Fn::Sub: DevOps-Subnet2-${Environment}-Id
        SecurityGroupIds:
          - !ImportValue 
              Fn::Sub: DevOps-SecurityGroup-${Environment}-Id
        EndpointPublicAccess: true

  # ?? Node Group
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      NodegroupName: !Sub nodegroup-${Environment}
      ClusterName: !Ref EKSCluster
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets:
        - !ImportValue 
            Fn::Sub: DevOps-Subnet1-${Environment}-Id
        - !ImportValue 
            Fn::Sub: DevOps-Subnet2-${Environment}-Id
      ScalingConfig:
        MinSize: 1
        MaxSize: 2
        DesiredSize: 1
      AmiType: AL2_x86_64
      InstanceTypes:
        - t3.medium
      DiskSize: 20

  # ?? Repositorio ECR
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub microservicio-${Environment}
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
